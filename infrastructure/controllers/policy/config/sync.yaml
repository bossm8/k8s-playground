---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 1h30m
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://ghcr.io/kyverno/charts/kyverno-policies
  ref:
    tag: "3.9.0"
    digest: "sha256:90579610a9d91664ffac8d6467841d12e697e40df6690221687b952b146c766a"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 10m0s
  driftDetection:
    mode: enabled
  chartRef:
    kind: OCIRepository
    name: kyverno-policies
  values:
    validationFailureAction: Audit
    policyType: ValidatingPolicy
