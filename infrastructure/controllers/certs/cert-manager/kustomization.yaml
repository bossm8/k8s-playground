---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager

resources:
  - namespace.yaml
  - netpol.yaml
  - rbac.yaml
  - sync.yaml

secretGenerator:
  - name: cosign-pubkey
    options:
      disableNameSuffixHash: true
    files:
      - cosign.pub=./assets/cert-manager-pubkey-2021-09-20.pem
