---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: falcosecurity
  namespace: infra-security
spec:
  interval: 1h30m
  url: https://falcosecurity.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco-operator
  namespace: infra-security
spec:
  interval: 15m
  timeout: 5m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: falco-operator
      version: 0.3.1
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: infra-security
      interval: 15m
  values:

    podLabels:
      k8s.mcathome.ch/allow-kube-api: 'true'

    excludedLabels:
      - kustomize.toolkit.fluxcd.io/*
