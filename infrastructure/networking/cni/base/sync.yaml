---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h30m
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  url: oci://quay.io/cilium/charts/cilium
  ref:
    tag: "1.20.1"
    digest: "sha256:906ce40d35daad838d12add8a5ba7033e767767f51799a93c7eace2cec9cdc05"
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "https://github.com/cilium/cilium/.*"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h30m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: cilium
  releaseName: cilium
  driftDetection:
    mode: enabled

  valuesFrom:
    - kind: ConfigMap
      name: cilium-helm-install
    - kind: ConfigMap
      name: cilium-helm-flux

